# ==============================================================================
# CONFIGURACIÓN VISUAL CORPORATIVA SAP FIORI HORIZON (ENTERPRISE HIGH-CONTRAST UI)
# ==============================================================================

[theme]
base = "light"
primaryColor = "#0057D2"              # Azul corporativo primario SAP Horizon
backgroundColor = "#F5F6F7"           # Fondo general de la aplicación (Canvas)
secondaryBackgroundColor = "#FFFFFF"  # Fondo de tarjetas y encabezados (Surface)
textColor = "#131E29"                 # Texto principal de alto contraste (WCAG AAA)
borderColor = "#D5DADD"               # Bordes de tarjetas y divisores
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"                    # Redondeo sobrio institucional
buttonRadius = "6px"
font = "'Segoe UI':https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap"
headingFont = "'Segoe UI':https://fonts.googleapis.com/css2?family=Segoe+UI:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["26px", "20px", "16px", "14px", "13px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# Colores Semánticos SAP Fiori Horizon
greenColor = "#106333"   # Confirmación / Estado Óptimo
redColor = "#A61C1C"     # Alerta Crítica / Error
yellowColor = "#7A4100"  # Atención / Advertencia
orangeColor = "#E76500"  # Riesgo Operativo
blueColor = "#0057D2"    # Plan Maestro / Demanda
violetColor = "#7C3AED"  # Variedades Estratégicas
grayColor = "#475569"    # Subtítulos y Metadatos

# Paleta Oficial S&OP para Gráficas
chartCategoricalColors = [
    "#0057D2",  # 1. Plan Maestro / Demanda Comercial (Azul SAP Horizon)
    "#106333",  # 2. Oferta de Cosecha / En Campo (Verde Acento)
    "#7A4100",  # 3. Solicitud de Propagación / Enraizamiento (Ámbar)
    "#7C3AED",  # 4. Programación de Siembra (Púrpura)
    "#0284C7",  # 5. Capacidad Ajustada (Celeste)
    "#A61C1C",  # 6. Techo Físico / Capacidad Máxima (Rojo Alerta)
    "#475569"   # 7. Línea Base Histórica (Gris Pizarra)
]

# Estilo de Tablas y DataFrames
dataframeBorderColor = "#D5DADD"
dataframeHeaderBackgroundColor = "#EDF0F2"
dataframeHeaderTextColor = "#131E29"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50
